# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"

  - package-ecosystem: "nuget"
    directories:
      - "/MyPo.Libs"
      - "/MyPo.Shared"
      - "/MyPo.Shared.EF"
      - "/MyPo.Api"
      - "/MyPo.Blazor/MyPo.Blazor"
      - "/MyPo.Blazor/MyPo.Blazor.App"
      - "/MyPo.Blazor/MyPo.Blazor.Client"
      - "/MyPo.Demo.Shared"
      - "/MyPo.Demo.Api"
      - "/MyPo.Blazor/MyPo.Blazor.Demo.App"
    schedule:
      interval: "weekly"
      day: "saturday"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"] # do not update to major version as it may contain breaking changes
