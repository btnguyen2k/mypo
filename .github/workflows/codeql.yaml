name: "CodeQL"

on:
  push:
    branches: [ '*' ]
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [ '*' ]
  schedule:
    # run every Saturday at 00:00 UTC
    - cron: '0 0 * * 6'

jobs:
  Analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Learn more about CodeQL language support at https://git.io/codeql-language-support
        language: [ 'csharp' ]
        sdk_version: [ '8.x' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install .NET SDK (if language is C#)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk_version }}
      - name: Pin .NET version (if language is C#)
        if: matrix.language == 'csharp'
        env:
          REQUESTED_DOTNET_VERSION: ${{ matrix.sdk_version }}
        shell: bash
        run: |
          set -euo pipefail

          SDK_MAJOR="${REQUESTED_DOTNET_VERSION%%.*}"
          SDK_VERSION=$(
            dotnet --list-sdks |
              awk -v prefix="${SDK_MAJOR}." \
                '$1 ~ ("^" prefix) { print $1 }' |
              sort -V |
              tail -n 1
          )

          if [ -z "${SDK_VERSION}" ]; then
            echo "❌ No installed .NET ${SDK_MAJOR}.x SDK was found."
            exit 1
          fi

          printf \
            '{"sdk":{"version":"%s","rollForward":"latestPatch"}}\n' \
            "${SDK_VERSION}" \
            > global.json

          dotnet --version
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yaml
      # Autobuild attempts to build any compiled languages (C/C++, C#, Java, etc).
      # If this step fails, then you should remove it and run the build manually (see below)
      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 https://git.io/JvXDl
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
