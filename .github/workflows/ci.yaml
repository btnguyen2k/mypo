name: 'ci'

on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - '.github/dependabot.yaml'
  pull_request:
    types: [ opened, edited, reopened, synchronize, review_requested ]
    branches: [ '**' ]
  workflow_call:
    inputs:
      target-sha:
        description: 'Commit SHA to check out and analyze.'
        required: false
        type: string
        default: ''

  # Allow manually trigger
  workflow_dispatch:

env:
  TAG_PREFIX: v
  DOCKER_IMAGE: btnguyen2k/mypo

jobs:
  BuildAndTest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: [ '8.x', '9.x', '10.x' ]
    name: Build and test with dotnet ${{ matrix.dotnet }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
      - name: Setup dotnet ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Display dotnet version
        run: dotnet --version
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-restore

  ReleaseDryRun:
    if: github.event_name == 'push'
    needs: BuildAndTest
    runs-on: ubuntu-latest
    outputs:
      RESULT: ${{ steps.release_dry_run.outputs.result }}
      VERSION: ${{ steps.release_dry_run.outputs.releaseVersion }}
      RELEASE_NOTES: ${{ steps.release_dry_run.outputs.releaseNotes }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Release (dry-run)
        id: release_dry_run
        uses: btnguyen2k/action-semrelease@37fe196d36496098bd291e9519c86772ea2e0c0d # v5.1.0
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branches: ${{ github.ref_name }}
          tag-prefix: ${{ env.TAG_PREFIX }}

  TestDockerfileLinux:
    needs: BuildAndTest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ 'linux/amd64', 'linux/arm64' ]
        # platform: [ 'linux/amd64' ] # Finance.NET not working with ARM yet!
        dockerfile: [ 'Dockerfile', 'Dockerfile.dev' ]
    name: Build and Test Docker image(s) for ${{ matrix.platform }} with ${{ matrix.dockerfile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
      - name: Build Docker image
        id: docker_build
        uses: btnguyen2k/gh-actions/dockerbp@dockerbp/v0.3.0
        with:
          target-sha: ${{ inputs.target-sha || github.sha }}
          image: ${{ env.DOCKER_IMAGE }}
          tags: ci
          platforms: ${{ matrix.platform }}
          dockerfile: ${{ matrix.dockerfile }}
          context: ./
          mode: build
          publish: local
      - name: Verify Docker build
        shell: bash
        run: |
          # check if output 'status' from step docker_build is 'local-built'
          if [[ "${{ steps.docker_build.outputs.status }}" != "local-built" ]]; then
              echo "❌ Docker build failed"
              exit 1
          fi
      - name: Test Docker container
        shell: bash
        env:
          STARTUP_TIMEOUT_SECONDS: '60'
        run: |
          set -euo pipefail

          docker images

          CONTAINER=$(docker run -d \
            --name test -p 1234:8080 \
            -e Databases__Identity__Type=Memory -e Databases__Portfolio__Type=Memory -e Databases__WolverineFx__Type=Memory \
            --platform ${{ matrix.platform }} \
            ${{ env.DOCKER_IMAGE }}:ci)
          trap '
            docker logs "$CONTAINER" || true
            docker rm -f "$CONTAINER" >/dev/null || true
          ' EXIT
          echo "ℹ️ Started Docker container with ID: ${CONTAINER}"
          DEADLINE=$((SECONDS + STARTUP_TIMEOUT_SECONDS))
          STATUS_CODE_HEALTHZ=000
          STATUS_CODE_BLAZOR=000
          while (( SECONDS < DEADLINE )); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER")" != "true" ]]; then
              echo "❌ Container exited before becoming healthy."
              exit 1
            fi
            REMAINING=$((DEADLINE - SECONDS))
            if (( REMAINING <= 0 )); then
              break
            fi
            REQUEST_TIMEOUT=$((REMAINING < 2 ? REMAINING : 2))

            # verify status code of health endpoint
            STATUS_CODE_HEALTHZ=$(curl -s -o /dev/null -m "$REQUEST_TIMEOUT" -w "%{http_code}" http://localhost:1234/healthz)
            if [[ "$STATUS_CODE_HEALTHZ" != "200" ]]; then
              echo "ℹ️ Health check status code: $STATUS_CODE_HEALTHZ"
            fi

            # verify status code of Blazor framework endpoint
            STATUS_CODE_BLAZOR=$(curl -s -o /dev/null -m "$REQUEST_TIMEOUT" -w "%{http_code}" http://localhost:1234/_framework/blazor.web.js)
            if [[ "$STATUS_CODE_BLAZOR" != "200" ]]; then
              echo "ℹ️ Blazor check status code: $STATUS_CODE_BLAZOR"
            fi

            if [[ "$STATUS_CODE_HEALTHZ" == "200" && "$STATUS_CODE_BLAZOR" == "200" ]]; then
              echo "✅ Container is healthy"
              exit 0
            fi

            if (( SECONDS < DEADLINE )); then
              sleep 1
            fi
          done
          echo "❌ Container did not become healthy within ${STARTUP_TIMEOUT_SECONDS}s."
          if [[ "$STATUS_CODE_HEALTHZ" != "200" ]]; then
            echo "❌ Health check failed with status code $STATUS_CODE_HEALTHZ"
          fi
          if [[ "$STATUS_CODE_BLAZOR" != "200" ]]; then
            echo "❌ Blazor check failed with status code $STATUS_CODE_BLAZOR"
          fi
          exit 1

  TestDockerfileWindows:
    needs: BuildAndTest
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [ 'windows/amd64' ]
        dockerfile: [ 'Dockerfile.win' ]
    name: Build and Test Docker image(s) for ${{ matrix.platform }} with ${{ matrix.dockerfile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-sha || github.sha }}
      - name: Build Docker image
        id: docker_build
        uses: btnguyen2k/gh-actions/dockerbp@dockerbp/v0.3.0
        with:
          target-sha: ${{ inputs.target-sha || github.sha }}
          image: ${{ env.DOCKER_IMAGE }}
          tags: ci
          platforms: ${{ matrix.platform }}
          dockerfile: ${{ matrix.dockerfile }}
          context: ./
          mode: build
          publish: local
      - name: Verify Docker build
        shell: bash
        run: |
          # check if output 'status' from step docker_build is 'local-built'
          if [[ "${{ steps.docker_build.outputs.status }}" != "local-built" ]]; then
              echo "❌ Docker build failed"
              exit 1
          fi
      - name: Test Docker container
        shell: bash
        env:
          STARTUP_TIMEOUT_SECONDS: '60'
        run: |
          set -euo pipefail

          docker images

          CONTAINER=$(docker run -d \
            --name test -p 1234:8080 \
            -e Databases__Identity__Type=Memory -e Databases__Portfolio__Type=Memory -e Databases__WolverineFx__Type=Memory \
            --platform ${{ matrix.platform }} \
            ${{ env.DOCKER_IMAGE }}:ci | tr -d '\r')
          trap '
            docker logs "$CONTAINER" || true
            docker rm -f "$CONTAINER" >/dev/null || true
          ' EXIT
          echo "ℹ️ Started Docker container with ID: ${CONTAINER}"
          DEADLINE=$((SECONDS + STARTUP_TIMEOUT_SECONDS))
          STATUS_CODE_HEALTHZ=000
          STATUS_CODE_BLAZOR=000
          while (( SECONDS < DEADLINE )); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER" | tr -d '\r')" != "true" ]]; then
              echo "❌ Container exited before becoming healthy."
              exit 1
            fi
            REMAINING=$((DEADLINE - SECONDS))
            if (( REMAINING <= 0 )); then
              break
            fi
            REQUEST_TIMEOUT=$((REMAINING < 2 ? REMAINING : 2))

            STATUS_CODE_HEALTHZ=$(curl.exe -s -o NUL -m "$REQUEST_TIMEOUT" -w "%{http_code}" http://localhost:1234/healthz)
            if [[ "$STATUS_CODE_HEALTHZ" != "200" ]]; then
              echo "ℹ️ Health check status code: $STATUS_CODE_HEALTHZ"
            fi

            REMAINING=$((DEADLINE - SECONDS))
            if (( REMAINING <= 0 )); then
              break
            fi
            REQUEST_TIMEOUT=$((REMAINING < 2 ? REMAINING : 2))

            STATUS_CODE_BLAZOR=$(curl.exe -s -o NUL -m "$REQUEST_TIMEOUT" -w "%{http_code}" http://localhost:1234/_framework/blazor.web.js)
            if [[ "$STATUS_CODE_BLAZOR" != "200" ]]; then
              echo "ℹ️ Blazor check status code: $STATUS_CODE_BLAZOR"
            fi

            if [[ "$STATUS_CODE_HEALTHZ" == "200" && "$STATUS_CODE_BLAZOR" == "200" ]]; then
              echo "✅ Container is healthy"
              exit 0
            fi

            if (( SECONDS < DEADLINE )); then
              sleep 1
            fi
          done
          echo "❌ Container did not become healthy within ${STARTUP_TIMEOUT_SECONDS}s."
          if [[ "$STATUS_CODE_HEALTHZ" != "200" ]]; then
            echo "❌ Health check failed with status code $STATUS_CODE_HEALTHZ"
          fi
          if [[ "$STATUS_CODE_BLAZOR" != "200" ]]; then
            echo "❌ Blazor check failed with status code $STATUS_CODE_BLAZOR"
          fi
          exit 1

